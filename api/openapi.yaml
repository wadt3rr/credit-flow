openapi: '3.1.0'
info:
  title: Credit Flow Application API
  version: '1.0.0'
  description: API для управления кредитными заявками
servers:
  - url: /api/v1
tags:
  - name: Application
    description: Управление заявками
security:
  - bearerAuth: []

paths:
  /applications:
    post:
      summary: Создание черновика заявки
      operationId: createApplicationDraft
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationDraftRequest'
      responses:
        '201':
          description: Черновик создан
          headers:
            Location:
              description: URI созданного черновика
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: Некорректное тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет доступа к ресурсу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Конфликт состояния
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Непредвиденная ошибка
          content:
            application/json:
             schema:
              $ref: '#/components/schemas/Error'
        
            
  
  /applications/{applicationId}:
    parameters:
      - $ref: '#/components/parameters/ApplicationIdParam'
    get:
      summary: Получение заявки по идентификатору
      operationId: getApplication

      responses:
        '200':
          description: Заявка найдена
          headers:
            ETag:
              description: Версия ресурса для контроля конкурентных изменений
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: Некорректный идентификатор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет доступа к ресурсу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Заявка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Непредвиденная ошибка
          content:
            application/json:
             schema:
              $ref: '#/components/schemas/Error'
    patch:
      summary: Изменение черновика заявки
      operationId: patchApplicationDraft
      parameters:
        - $ref: '#/components/parameters/IfMatchParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationDraftRequest'
        
      responses:
        '200':
          description: Черновик успешно изменён
          headers:
            ETag:
              description: Новая версия ресурса
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'

        '400':
          description: Некорректный запрос или ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет доступа к ресурсу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Заявка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Конфликт состояния
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Несоответствие версий ресурса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '428':
          description: Не предоставлена версия ресурса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Непредвиденная ошибка
          content:
            application/json:
             schema:
              $ref: '#/components/schemas/Error'
  
  /applications/{applicationId}/submit:
    post:
      operationId: submitApplication
      parameters:
        - $ref: '#/components/parameters/ApplicationIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyParam'
        - $ref: '#/components/parameters/IfMatchParam'
      summary: Принять заявку в работу
      responses:
        '202':
          description: Заявка успешно принята в обработку. Дальнейшая обработка выполняется асинхронно
          headers:
            ETag:
              description: Новая версия ресурса
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет доступа к ресурсу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Заявка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Заявка не находится в состоянии DRAFT или конфликт идемпотентности
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Несоответствие версий ресурса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '428':
          description: Не предоставлена версия ресурса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Непредвиденная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ApplicationIdParam:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: true
      description: Уникальный ключ для защиты от повторного выполнения операции
      schema:
        type: string
        minLength: 16
        maxLength: 256
    IfMatchParam:
      name: If-Match
      in: header
      required: true
      description: ETag версии заявки, полученной при последнем чтении
      schema:
        type: string

    

  schemas:
    CreateApplicationDraftRequest:
      type: object
      additionalProperties: false
      required: [companyId, productId, amount, term, purpose]
      properties: 
        companyId:
          description: Идентификатор компании
          type: string
          format: uuid
        productId:
          description: Идентификатор кредитного продукта
          type: string
          format: uuid
        amount:
          description: Запрашиваемая сумма в копейках
          type: integer
          format: int64
          minimum: 1
        term:
          description: Срок кредитования в месяцах
          type: integer
          minimum: 1
        purpose:
          description: Цель кредитования
          type: string
          minLength: 1
          maxLength: 1000
      
    Application:
     type: object
     additionalProperties: false
     required: [id, companyId, productId, amount, term, purpose, status, createdAt, updatedAt]
     properties: 
        id:
          description: Идентификатор заявки
          type: string
          format: uuid
        companyId:
          description: Идентификатор компании
          type: string
          format: uuid
        productId:
          description: Идентификатор кредитного продукта
          type: string
          format: uuid
        amount:
          description: Запрашиваемая сумма в копейках
          type: integer
          format: int64
          minimum: 1
        term:
          description: Срок кредитования в месяцах
          type: integer
          minimum: 1
        purpose:
          description: Цель кредитования
          type: string
          minLength: 1
          maxLength: 1000
        status:
          description: Текущий статус заявки
          type: string
          enum:
            - DRAFT
            - SUBMITTED
            - VERIFYING
            - UNDER_REVIEW
            - APPROVED
            - REJECTED
            - CANCELLED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time      
    UpdateApplicationDraftRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties: 
        amount:
          description: Запрашиваемая сумма в копейках
          type: integer
          format: int64
          minimum: 1
        term:
          description: Срок кредитования в месяцах
          type: integer
          minimum: 1
        purpose:
          description: Цель кредитования
          type: string
          minLength: 1
          maxLength: 1000
    Error:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties: 
        code:
          type: string
          minLength: 1
          maxLength: 500
        message:
          type: string
          minLength: 1
          maxLength: 1000
        requestId:
          type: string
          format: uuid
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, code, message]
            properties: 
              field:
                type: string
                minLength: 1
                maxLength: 100
              code:
                type: string
                minLength: 1
                maxLength: 500
              message:
                type: string
                minLength: 1
                maxLength: 1000

          
          
      