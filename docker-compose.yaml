services:
  postgres:
    image: postgres:18
    container_name: credit-flow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: credit_flow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: application_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: